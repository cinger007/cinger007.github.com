<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全部动态 · 李昕课题组</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            line-height: 1.6;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 3rem;
        }

        /* 顶部导航栏 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 1.2rem;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .page-header h1 i {
            color: #2563eb;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-home {
            background: #0f172a;
            color: white;
            border: none;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-home:hover {
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
        }

        /* 搜索框 */
        .search-box {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 40px;
            padding: 0 1rem;
            border: 2px solid transparent;
            transition: 0.3s;
        }
        .search-box:focus-within {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .search-box i {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .search-box input {
            border: none;
            background: transparent;
            padding: 0.6rem 0.8rem;
            font-size: 0.95rem;
            outline: none;
            width: 200px;
            color: #1e293b;
            font-family: inherit;
        }
        .search-box input::placeholder {
            color: #94a3b8;
        }
        .search-box .clear-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 0.2rem;
            display: none;
        }
        .search-box .clear-btn.visible {
            display: block;
        }
        .search-box .clear-btn:hover {
            color: #ef4444;
        }

        /* 统计信息 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            color: #64748b;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .stats-bar .count {
            font-weight: 600;
            color: #0f172a;
        }
        .stats-bar .highlight {
            color: #2563eb;
        }

        /* 新闻列表（全部） */
        .news-list {
            list-style: none;
        }
        .news-list li {
            padding: 0.8rem 0;
            border-bottom: 1px solid #eef2f6;
            font-size: 1rem;
            display: flex;
            gap: 1rem;
            transition: 0.2s;
            padding-left: 0.5rem;
            border-radius: 8px;
        }
        .news-list li:hover {
            background: #f8fafc;
            padding-left: 1rem;
        }
        .news-list .date {
            color: #2563eb;
            font-weight: 600;
            white-space: nowrap;
            min-width: 110px;
            flex-shrink: 0;
            padding-top: 0.05rem;
        }
        .news-list .content {
            flex: 1;
        }
        .news-list .content i {
            color: #2563eb;
            margin-left: 0.3rem;
        }

        /* 无结果提示 */
        .no-result {
            text-align: center;
            padding: 3rem 0;
            color: #94a3b8;
        }
        .no-result i {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .page-container { padding: 1.5rem; }
            .page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.8rem;
            }
            .page-header h1 { font-size: 1.4rem; }
            .header-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box input { width: 100%; }
            .search-box { width: 100%; }
            .btn-home { justify-content: center; }
            .news-list li { flex-wrap: wrap; }
            .news-list .date { min-width: 100%; }
            .stats-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="page-container">
    <!-- 顶部：标题 + 返回 + 搜索 -->
    <div class="page-header">
        <h1><i class="fas fa-rss"></i> 全部动态</h1>
        <div class="header-actions">
            <!-- 搜索框 -->
            <div class="search-box" id="searchBox">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索动态..." autocomplete="off" />
                <button class="clear-btn" id="clearBtn" title="清除搜索"><i class="fas fa-times-circle"></i></button>
            </div>
            <!-- 返回主页按钮 -->
            <a href="index.html" class="btn-home" target="_blank">
                <i class="fas fa-arrow-left"></i> 返回主页
            </a>
        </div>
    </div>

    <!-- 统计信息 -->
    <div class="stats-bar">
        <span>共 <span class="count" id="totalCount">0</span> 条动态</span>
        <span id="resultInfo"></span>
    </div>

    <!-- 新闻列表 -->
    <ul class="news-list" id="newsList">
        <!-- 由 JavaScript 动态渲染 -->
    </ul>
</div>

<!-- ===== 引入独立的数据文件 ===== -->
<script src="news.js"></script>

<!-- ===== 页面逻辑 ===== -->
<script>
// ===== DOM 引用 =====
const listEl = document.getElementById('newsList');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const totalCountEl = document.getElementById('totalCount');
const resultInfoEl = document.getElementById('resultInfo');

// ===== 渲染函数（支持关键词过滤） =====
function renderNews(keyword = '') {
    const trimmed = keyword.trim().toLowerCase();
    let filtered = newsData;

    if (trimmed !== '') {
        filtered = newsData.filter(item => {
            // 搜索匹配：日期 + 文本内容（去除HTML标签后匹配）
            const plainText = item.text.replace(/<[^>]+>/g, '');
            return item.date.includes(trimmed) || 
                   plainText.toLowerCase().includes(trimmed) ||
                   item.text.toLowerCase().includes(trimmed);
        });
    }

    // 更新统计
    totalCountEl.textContent = newsData.length;
    if (trimmed !== '') {
        resultInfoEl.innerHTML = `🔍 搜索 "<strong>${trimmed}</strong>" 找到 <strong class="highlight">${filtered.length}</strong> 条`;
    } else {
        resultInfoEl.textContent = '';
    }

    // 渲染列表
    if (filtered.length === 0) {
        listEl.innerHTML = `
            <div class="no-result">
                <i class="fas fa-search"></i>
                <p>没有找到与 "<strong>${trimmed}</strong>" 相关的动态</p>
            </div>
        `;
        return;
    }

    listEl.innerHTML = filtered.map(item => `
        <li>
            <span class="date">${item.date}</span>
            <span class="content">${item.text} <i class="fas ${item.icon}"></i></span>
        </li>
    `).join('');
}

// ===== 搜索事件 =====
searchInput.addEventListener('input', function() {
    const val = this.value;
    if (val.length > 0) {
        clearBtn.classList.add('visible');
    } else {
        clearBtn.classList.remove('visible');
    }
    renderNews(val);
});

// ===== 清除按钮 =====
clearBtn.addEventListener('click', function() {
    searchInput.value = '';
    clearBtn.classList.remove('visible');
    renderNews('');
    searchInput.focus();
});

// ===== 键盘快捷键：ESC 清除搜索 =====
searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        this.value = '';
        clearBtn.classList.remove('visible');
        renderNews('');
        this.blur();
    }
});

// ===== 初始渲染 =====
renderNews('');
</script>

</body>
</html>

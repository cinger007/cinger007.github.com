        // ---------- 辅助函数 ----------
        function getLevelScore(levelStr) {
            if (levelStr.includes('一区')) return 1;
            if (levelStr.includes('二区')) return 2;
            if (levelStr.includes('三区')) return 3;
            if (levelStr.includes('四区')) return 4;
            if (levelStr.includes('会议')) return 5;
            return 6; // 其他
        }

        // 渲染卡片
        function renderCards(papers) {
            const grid = document.getElementById('cardGrid');
            if (!papers.length) {
                grid.innerHTML = `<div class="empty-state">暂无匹配的论文</div>`;
                return;
            }

            let html = '';
            papers.forEach(p => {
                const abstractText = p.abstract || '';
                const truncated = abstractText.length > 120 ? abstractText.slice(0, 120) + '...' : abstractText;
                const showToggle = abstractText.length > 120;

                const levelDisplay = p.level || '';

                html += `
                    <div class="publication-card">
                        <div class="image-container">
                            <img src="${p.img || 'assets/img/placeholder.png'}" alt="${p.title}" loading="lazy">
                        </div>
                        <div class="content">
                            <div class="title">${p.title} <span class="meta-year">(${p.year})</span></div>
                            <div class="journal">${p.journal}</div>
                            <div class="author">${p.author}</div>
                            <div class="abstract-container">
                                <span class="abstract-truncated">
                                    ${truncated}
                                    ${showToggle ? '<span class="toggle-text" onclick="this.parentElement.innerText = this.parentElement.innerText.replace(\'...\', \'\') + \' \' + \'' + p.abstract.replace(/'/g, "\\'") + '\'; this.style.display=\'none\';">展开</span>' : ''}
                                </span>
                            </div>
                            <div class="links">
                                <a href="${p.links.pdf}" target="_blank" class="link">PDF</a>
                                <a href="#" class="link" onclick="alert('BibTeX: ${p.links.bibtex.replace(/'/g, "\\'")}'); return false;">BibTeX</a>
                                <a href="#" class="link" onclick="alert('GB/T: ${p.links.gb.replace(/'/g, "\\'")}'); return false;">GB/T</a>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // 排序逻辑
        function sortPapers(papers, sortKey) {
            const copy = [...papers];
            switch (sortKey) {
                case 'level-desc':
                    copy.sort((a, b) => (a.levelScore || getLevelScore(a.level)) - (b.levelScore || getLevelScore(b.level)));
                    break;
                case 'level-asc':
                    copy.sort((a, b) => (b.levelScore || getLevelScore(b.level)) - (a.levelScore || getLevelScore(a.level)));
                    break;
                case 'year-desc':
                    copy.sort((a, b) => b.year - a.year);
                    break;
                case 'year-asc':
                    copy.sort((a, b) => a.year - b.year);
                    break;
                default:
                    break;
            }
            return copy;
        }

        // ---------- 初始化 ----------
        const selectEl = document.getElementById('sortSelect');
        let currentPapers = [...papersData];

        function updateAndRender() {
            const sortVal = selectEl.value;
            const sorted = sortPapers(currentPapers, sortVal);
            renderCards(sorted);
        }

        selectEl.addEventListener('change', updateAndRender);

        // 首次渲染
        updateAndRender();

        // 暴露全局函数给内联 onclick 使用（展开功能）
        window.toggleAbstract = function(el, fullText) {
            el.parentElement.innerText = fullText;
        };
    })();
</script>

const BVID = 'BV1ZP4y1V7pD';

function render() {
    const app = document.getElementById('app');
    let html = '';

    chapters.forEach(ch => {
        html += `
            <div class="chapter">
                <div class="chapter-title">
                    <i class="fas fa-book"></i> ${ch.title}
                    <span class="badge">${ch.videos.length} 节</span>
                </div>
                ${ch.desc ? `<div class="chapter-desc">${ch.desc}</div>` : ''}
                <div class="video-grid">
        `;

        ch.videos.forEach(v => {
            const iframeSrc = `//player.bilibili.com/player.html?aid=891583598&bvid=${BVID}&cid=436905390&page=${v.page}`;
            // B站链接（带p参数）
            const bilibiliUrl = `https://www.bilibili.com/video/${BVID}?p=${v.page}`;
            const descText = v.desc.replace(/\n/g, ' ').replace(/"/g, '&quot;');
            const needExpand = v.desc.length > 80;

            html += `
                <div class="video-card">
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="desc" ${needExpand ? 'data-expandable="true"' : ''}>
                            ${descText}
                            ${needExpand ? `<span class="more-btn" onclick="toggleDesc(this)"> 展开</span>` : ''}
                        </div>
                        <a href="${bilibiliUrl}" target="_blank" class="video-link">
                            <i class="fab fa-bilibili"></i> 在B站观看 <i class="fas fa-external-link-alt"></i>
                        </a>
                    </div>
                </div>
            `;
        });

        html += `
                </div>
            </div>
        `;
    });

    app.innerHTML = html;
}

// ===== 展开/收起功能 =====
function toggleDesc(el) {
    const card = el.closest('.video-card');
    const desc = card.querySelector('.desc');
    if (desc.classList.contains('desc-expanded')) {
        desc.classList.remove('desc-expanded');
        el.textContent = ' 展开';
    } else {
        desc.classList.add('desc-expanded');
        el.textContent = ' 收起';
    }
}

// ===== 页面加载 =====
document.addEventListener('DOMContentLoaded', render);
</script>
